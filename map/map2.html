<!DOCTYPE html>

<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title>Ramen Places</title>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

	 <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</head>
<body>
	<div id="map" style="height: 650px; "> </div>

	
	<script>
		var map = L.map('map').setView([41.892, -87.63], 16);

		L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png', {
           attribution: 'Map tiles by Carto, under CC BY 3.0. Data by OpenStreetMap, under ODbL.',
          
         }).addTo(map);

		var LeafIcon = L.Icon.extend({
			options: {

				iconSize:     [66, 66],

				iconAnchor:   [22, 94],

				popupAnchor:  [-3, -76]
			}
		});

		var Icon = new LeafIcon({iconUrl: 'map2_files/ramen.png'});

		L.marker([41.8923803,-87.6222875], {icon: Icon}).bindPopup("Ramen Misoya").addTo(map);
		L.marker([41.889944,-87.6308142], {icon: Icon}).bindPopup("Ramen San").addTo(map);
		L.marker([41.894507,-87.6350622], {icon: Icon}).bindPopup("Cocoro").addTo(map);
		L.marker([41.890271,-87.6324582], {icon: Icon}).bindPopup("Slurping Turtle").addTo(map);

	</script>

</body></html>
